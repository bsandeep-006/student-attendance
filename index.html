<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>📚 Student Attendance Register</h1>
        <p>7 Period Attendance</p>
    </header>

    <div class="controls">

        <div>
            <label>Date</label>
            <input type="date" id="date">
        </div>

        <div>
            <label>Class</label>
            <input type="text" id="className" placeholder="Enter class">
        </div>

        <div>
            <label>Search</label>
            <input type="text" id="search" placeholder="Search student">
        </div>

        <button onclick="exportCSV()" class="export">
            📥 Export CSV
        </button>

    </div>

    <div class="add-student">

        <h2>Add Student</h2>

        <input
            type="text"
            id="roll"
            placeholder="Roll Number"
        >

        <input
            type="text"
            id="name"
            placeholder="Student Name"
        >

        <button onclick="addStudent()" class="add">
            + Add Student
        </button>

    </div>

    <div class="stats">

        <div class="stat total">
            <h3>Students</h3>
            <p id="studentCount">0</p>
        </div>

        <div class="stat present">
            <h3>Present</h3>
            <p id="presentCount">0</p>
        </div>

        <div class="stat absent">
            <h3>Absent</h3>
            <p id="absentCount">0</p>
        </div>

        <div class="stat percentage">
            <h3>Attendance</h3>
            <p id="percentage">0%</p>
        </div>

    </div>

    <div class="table-box">

        <h2>Attendance Register</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Roll</th>
                        <th>Student Name</th>
                        <th>P1</th>
                        <th>P2</th>
                        <th>P3</th>
                        <th>P4</th>
                        <th>P5</th>
                        <th>P6</th>
                        <th>P7</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

        <div class="legend">
            <span class="p">🟢 Present</span>
            <span class="a">🔴 Absent</span>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
