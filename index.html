```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Student Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📚 Student Attendance Register</h1>

    <!-- DATE & PERIOD -->
    <div class="controls">

        <div>
            <label>📅 Date</label>
            <input type="date" id="date">
        </div>

        <div>
            <label>📚 Period</label>

            <select id="period">
                <option value="1">Period 1</option>
                <option value="2">Period 2</option>
                <option value="3">Period 3</option>
                <option value="4">Period 4</option>
                <option value="5">Period 5</option>
                <option value="6">Period 6</option>
                <option value="7">Period 7</option>
            </select>
        </div>

    </div>


    <!-- QUICK BUTTONS -->
    <div class="quick-buttons">

        <button class="all-present" onclick="markAll('Present')">
            🟢 Mark All Present
        </button>

        <button class="all-absent" onclick="markAll('Absent')">
            🔴 Mark All Absent
        </button>

    </div>


    <!-- ATTENDANCE TABLE -->
    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>S.No</th>
                    <th>Roll Number</th>
                    <th>Student Name</th>
                    <th>Present</th>
                    <th>Absent</th>
                </tr>

            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>


    <!-- SAVE -->
    <button class="save-button" onclick="saveAttendance()">
        💾 SAVE ATTENDANCE
    </button>


    <!-- SUMMARY -->
    <div class="summary">

        <div class="box total">
            <span>Total</span>
            <b id="total">0</b>
        </div>

        <div class="box present">
            <span>Present</span>
            <b id="present">0</b>
        </div>

        <div class="box absent">
            <span>Absent</span>
            <b id="absent">0</b>
        </div>

        <div class="box notmarked">
            <span>Not Marked</span>
            <b id="notMarked">0</b>
        </div>

    </div>


    <div id="message"></div>

</div>

<script src="script.js"></script>

</body>
</html>
```
