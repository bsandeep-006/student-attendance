```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Attendance Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>📚 Student Attendance Register</h1>
        <p>Daily 7 Period Attendance System</p>
    </header>


    <!-- ADD ATTENDANCE -->
    <div class="card">

        <h2>➕ Add Attendance</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name">
            </div>


            <div class="form-group">
                <label>Roll Number</label>

                <input
                    type="text"
                    id="rollNumber"
                    placeholder="Enter roll number">
            </div>


            <div class="form-group">
                <label>Date</label>

                <input
                    type="date"
                    id="attendanceDate">
            </div>


            <div class="form-group">
                <label>Period</label>

                <select id="period">

                    <option value="">Select Period</option>

                    <option value="1">Period 1</option>
                    <option value="2">Period 2</option>
                    <option value="3">Period 3</option>
                    <option value="4">Period 4</option>
                    <option value="5">Period 5</option>
                    <option value="6">Period 6</option>
                    <option value="7">Period 7</option>

                </select>
            </div>


            <div class="form-group">
                <label>Attendance</label>

                <select id="status">

                    <option value="">
                        Select Attendance
                    </option>

                    <option value="Present">
                        Present
                    </option>

                    <option value="Absent">
                        Absent
                    </option>

                </select>
            </div>

        </div>


        <button
            class="add-button"
            onclick="addAttendance()">

            ➕ Add Attendance

        </button>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-box blue">
            <span>Total Records</span>
            <strong id="totalRecords">0</strong>
        </div>


        <div class="summary-box green">
            <span>Present</span>
            <strong id="totalPresent">0</strong>
        </div>


        <div class="summary-box red">
            <span>Absent</span>
            <strong id="totalAbsent">0</strong>
        </div>


        <div class="summary-box purple">
            <span>Attendance %</span>
            <strong id="percentage">0%</strong>
        </div>

    </div>


    <!-- FILTER -->

    <div class="card">

        <h2>🔎 Search Attendance</h2>

        <div class="filter-row">

            <input
                type="text"
                id="search"
                placeholder="Search name or roll number"
                oninput="displayAttendance()">


            <input
                type="date"
                id="filterDate"
                onchange="displayAttendance()">


            <select
                id="filterPeriod"
                onchange="displayAttendance()">

                <option value="">All Periods</option>

                <option value="1">Period 1</option>
                <option value="2">Period 2</option>
                <option value="3">Period 3</option>
                <option value="4">Period 4</option>
                <option value="5">Period 5</option>
                <option value="6">Period 6</option>
                <option value="7">Period 7</option>

            </select>


            <button
                class="clear-filter"
                onclick="clearFilters()">

                Clear Filters

            </button>

        </div>

    </div>


    <!-- ATTENDANCE TABLE -->

    <div class="card">

        <h2>📋 Attendance Records</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>S.No</th>
                        <th>Date</th>
                        <th>Roll No</th>
                        <th>Student Name</th>
                        <th>Period</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="attendanceTable">

                </tbody>

            </table>

        </div>

    </div>


    <!-- DATA MANAGEMENT -->

    <div class="card data-card">

        <h2>💾 Data Management</h2>

        <div class="data-buttons">

            <button
                class="danger-button"
                onclick="deleteAllAttendance()">

                🗑 Delete All Data

            </button>

            <button
                class="export-button"
                onclick="exportData()">

                📥 Export Data

            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
```
